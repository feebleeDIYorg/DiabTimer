# Aufbau übernommen aus feebleeDIYorg/LoopWorkspace (.github/workflows/create_certs.yml).
# Abweichung: Es gibt keinen Nuke-Job. Das Verteilungszertifikat in Match-Secrets teilen sich
# mehrere Apps, es wird nur zentral im Loop-Fork erneuert. Fehlt ein gültiges Zertifikat,
# bricht dieser Workflow mit einem Hinweis ab, statt Zertifikate zu widerrufen.
name: 3. Create Certificates
run-name: Create Certificates (${{ github.ref_name }})

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      force_profiles:
        description: "Profile von DiabTimer neu erzeugen (nach Capability-Änderungen)"
        type: boolean
        default: false

env:
  TEAMID: ${{ secrets.TEAMID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_TOKEN: ${{ secrets.GH_PAT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  create_certs:
    name: Certificates
    needs: validate
    runs-on: xcode-27
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      # Patch Fastlane Match to not print tables
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      - name: Install Project Dependencies
        run: bundle install

      # Sync the GitHub runner clock with the Windows time server (workaround as suggested in https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Check Distribution certificate
        run: |
          bundle exec fastlane check_and_renew_certificates
          if [ "$(cat fastlane/new_certificate_needed.txt 2>/dev/null)" = "true" ]; then
            echo "::error::❌ Kein gültiges Verteilungszertifikat. Es wird von mehreren Apps geteilt und nur zentral erneuert: Im Loop-Fork den Workflow '3. Create Certificates' mit ENABLE_NUKE_CERTS=true ausführen, danach diesen Workflow erneut starten."
            exit 1
          fi

      - name: Create or update provisioning profiles for DiabTimer
        run: bundle exec fastlane certs
        env:
          FORCE_PROFILES: ${{ inputs.force_profiles }}
