# Aufbau übernommen aus feebleeDIYorg/LoopWorkspace (.github/workflows/build_loop_auto.yml).
# Abweichungen:
# - statt Upstream-Sync: Vergleich von `main` mit dem Tag `testflight-latest`
# - der Workflow aktiviert sich bei jedem Lauf selbst neu, damit GitHub den Zeitplan nach
#   60 Tagen ohne Aktivität nicht abschaltet
# - Warnung, wenn der letzte TestFlight-Build älter als 60 Tage ist
name: 4. Build DiabTimer Auto
run-name: Build DiabTimer Auto (${{ github.ref_name }})

on:
  workflow_dispatch:
  schedule:
    # Jeden Sonntag prüfen. Gebaut wird bei neuen Commits oder am 2. Sonntag im Monat.
    - cron: "33 7 * * 0" # Sunday at UTC 7:33

jobs:
  check_status:
    runs-on: ubuntu-26.04
    name: Check status to decide whether to build
    outputs:
      NEW_COMMITS: ${{ steps.commits.outputs.new_commits }}
      IS_SECOND_IN_MONTH: ${{ steps.date-check.outputs.is_second_instance }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # GitHub deaktiviert geplante Workflows nach 60 Tagen ohne Aktivität im Repo.
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build_diabtimer_auto.yml/enable" \
            && echo "Zeitplan ist aktiv." \
            || echo "::warning::Zeitplan konnte nicht reaktiviert werden (GH_PAT braucht das Recht 'workflow')."

      - name: Check for new commits since last TestFlight build
        id: commits
        run: |
          if git rev-parse -q --verify "refs/tags/testflight-latest" >/dev/null; then
            BUILT=$(git rev-parse "testflight-latest^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$BUILT" = "$HEAD_SHA" ]; then
              echo "new_commits=false" >> "$GITHUB_OUTPUT"
            else
              echo "new_commits=true" >> "$GITHUB_OUTPUT"
            fi
            AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct "testflight-latest") ) / 86400 ))
            if [ "$AGE_DAYS" -gt 60 ]; then
              echo "::warning::Der letzte TestFlight-Build ist $AGE_DAYS Tage alt. Builds laufen nach 90 Tagen ab."
            fi
          else
            echo "Noch kein TestFlight-Build markiert."
            echo "new_commits=true" >> "$GITHUB_OUTPUT"
          fi

      # Set a logic flag if this is the second instance of this day-of-week in this month
      - name: Check if this is the second time this day-of-week happens this month
        id: date-check
        run: |
          WEEK_OF_MONTH=$(( ($(date +%-d) - 1) / 7 + 1 ))
          if [[ $WEEK_OF_MONTH -eq 2 ]]; then
            echo "is_second_instance=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_second_instance=false" >> "$GITHUB_OUTPUT"
          fi

  # When a scheduled run finds nothing new to build, cancel the run so it shows
  # as "cancelled" instead of "success" — a green check should always mean a
  # new build was made.
  cancel_when_no_build:
    needs: check_status
    name: Cancel run when there is nothing to build
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    if: |
      github.event_name == 'schedule' &&
        !(vars.SCHEDULED_BUILD != 'false' && needs.check_status.outputs.IS_SECOND_IN_MONTH == 'true') &&
        !(vars.BUILD_ON_NEW_COMMITS != 'false' && needs.check_status.outputs.NEW_COMMITS == 'true')
    steps:
      - name: Cancel the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Keine neuen Commits und kein monatlicher Build fällig — Lauf wird abgebrochen." >> "$GITHUB_STEP_SUMMARY"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
          sleep 300

  build:
    needs: [check_status]
    name: Build
    if: |
      github.event_name == 'workflow_dispatch' ||
        (vars.SCHEDULED_BUILD != 'false' && needs.check_status.outputs.IS_SECOND_IN_MONTH == 'true') ||
        (vars.BUILD_ON_NEW_COMMITS != 'false' && needs.check_status.outputs.NEW_COMMITS == 'true')
    uses: ./.github/workflows/build_diabtimer.yml
    permissions:
      contents: write
    secrets: inherit
