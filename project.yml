# XcodeGen-Projektbeschreibung. Das Xcode-Projekt wird nicht eingecheckt, sondern mit
#   xcodegen generate
# erzeugt (lokal und in der CI).
name: DiabTimer

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
  groupSortPosition: top

configFiles:
  Debug: Config/DiabTimerConfig.xcconfig
  Release: Config/DiabTimerConfig.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  DiabTimerKit:
    path: Packages/DiabTimerKit

targets:
  DiabTimer:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: DiabTimerKit
        product: TimerCore
      - package: DiabTimerKit
        product: NightscoutKit
      - package: DiabTimerKit
        product: Persistence
      - target: DiabTimerWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAIN_APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: DiabTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/DiabTimer.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(MAIN_APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(BACKGROUND_REFRESH_IDENTIFIER)
        DTAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        DTBackgroundRefreshIdentifier: $(BACKGROUND_REFRESH_IDENTIFIER)

  DiabTimerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: DiabTimerKit
        product: TimerCore
      - package: DiabTimerKit
        product: NightscoutKit
      - package: DiabTimerKit
        product: Persistence
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAIN_APP_BUNDLE_IDENTIFIER).DiabTimerWidgetExtension
        PRODUCT_NAME: DiabTimerWidgetExtension
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/DiabTimerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: $(MAIN_APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        DTAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        DTBackgroundRefreshIdentifier: $(BACKGROUND_REFRESH_IDENTIFIER)

  DiabTimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DiabTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAIN_APP_BUNDLE_IDENTIFIER).UITests
        TEST_TARGET_NAME: DiabTimer
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DiabTimer:
    build:
      targets:
        DiabTimer: all
        DiabTimerWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DiabTimerUITests
    archive:
      config: Release
